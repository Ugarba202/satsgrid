version: "3.8"

services:
  bitcoind:
    image: polarlightning/bitcoind:26.0
    container_name: satsgrid-regtest-bitcoind
    ports:
      - "18443:18443"
      - "28332:28332"
      - "28333:28333"
    environment:
      - BITCOIN_NETWORK=regtest
    volumes:
      - bitcoind_data:/root/.bitcoin
    restart: unless-stopped

  alice-lnd:
    image: lightninglabs/lnd:v0.18.0-beta
    container_name: satsgrid-regtest-alice-lnd
    ports:
      - "8081:8080" # REST port for Payer (Alice)
      - "10001:10009" # gRPC port for Alice
      - "9735:9735" # P2P port
    depends_on:
      - bitcoind
    volumes:
      - alice_data:/root/.lnd
    restart: unless-stopped

  bob-lnd:
    image: lightninglabs/lnd:v0.18.0-beta
    container_name: satsgrid-regtest-bob-lnd
    ports:
      - "8082:8080" # REST port for Provider (Bob)
      - "10002:10009" # gRPC port for Bob
      - "9736:9735" # P2P port
    depends_on:
      - bitcoind
    volumes:
      - bob_data:/root/.lnd
    restart: unless-stopped

volumes:
  bitcoind_data:
  alice_data:
  bob_data:
